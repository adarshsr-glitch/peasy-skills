<!-- @dsCard height=300 -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Cover</title>
<style>
html,body{margin:0;height:100%;background:var(--page-bg)}
.c{position:relative;width:960px;height:300px;overflow:hidden;font-family:var(--font-sans)}
svg{position:absolute;left:0;top:0}
.blue{fill:var(--primary-500)} .purple{fill:var(--secondary-500)} .pink{fill:var(--tertiary-500)} .cream{fill:var(--cream-500)} .ink{fill:var(--dark-500)} .white{fill:var(--white)}
.t{position:absolute;left:40px;bottom:40px;max-width:440px}
.t h1{margin:0;font-weight:500;font-size:104px;line-height:.92;color:var(--dark-500)}
.t p{margin:12px 0 0;font-size:14px;color:var(--dark-300)}
</style></head><body><div class="c">
<!-- blocks: primary-500 hero slab 336x232 r40, secondary-500 panel 184x152 r40, tertiary-500 pill 160x80, cream-500 slab 184x96 r24 -->
<!-- arrangement: one tall rounded slab with satellites, bleeding off the top and right edge, like Peasy's stacked page panels -->
<!-- pattern: discs and pills from rounded-full (the 3-step number discs) — Peasy is soft, friendly, large radii -->
<!-- scales: spacing s-6 24, s-8 32, s-10 40; radii rounded-panel 40, rounded-3xl 24, rounded-full -->
<svg width="960" height="300" viewBox="0 0 960 300">
  <rect class="cream" x="520" y="-24" width="184" height="96" rx="24"/>
  <rect class="blue" x="520" y="96" width="336" height="232" rx="40"/>
  <rect class="purple" x="728" y="-40" width="256" height="112" rx="40"/>
  <rect class="pink" x="880" y="120" width="160" height="80" rx="40"/>
  <circle class="pink" cx="584" cy="256" r="24"/>
  <circle class="white" cx="672" cy="208" r="24"/>
  <circle class="purple" cx="760" cy="160" r="24"/>
  <circle class="blue" cx="920" cy="256" r="16"/>
</svg>
<div class="t"><h1>Peasy</h1><p>Vergelijken, easy en eerlijk. Da’s Peasy.</p></div>
</div></body></html>
